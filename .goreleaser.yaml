version: 2

project_name: mss

builds:
  - main: ./cmd/mss
    binary: mss
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # The skill ships beside the binary: the binary is the engine, the skill is
    # what teaches an agent to drive it on explicit request only.
    files:
      - LICENSE
      - README.md
      - README.zh-CN.md
      - skills/mss/SKILL.md
      - skills/mss/SKILL.zh-CN.md
      - skills/mss/agents/openai.yaml
      - docs/install.md

checksum:
  name_template: checksums.txt


changelog:
  sort: asc
