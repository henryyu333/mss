name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # workflow_call runs the three-OS checks on this tag's commit, not on main.
  checks:
    uses: ./.github/workflows/ci.yml

  package:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Require the checked-out release tag
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --skip=publish
      - name: Package exact tagged source and standalone formula
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="mss-${version}/" \
            --output="dist/mss_${version}_source.tar.gz" "${GITHUB_REF_NAME}^{commit}"
          python tools/verify-release.py prepare --dist dist --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/mss.rb

  archives:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist
      - name: Verify archives and native binary and embedded installer
        run: python tools/verify-release.py verify --dist dist --tag "${{ github.ref_name }}"

  publish:
    needs: [checks, package, archives]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist
      - name: Publish only the validated artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag pattern accepts vX.Y.Z-suffix; a suffixed tag is a
          # prerelease candidate, not a stable release.
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            "${prerelease[@]}" dist/*.tar.gz dist/*.zip dist/checksums.txt dist/mss.rb
