name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: sqlite3 and zstd for the store tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sqlite3 zstd
      - name: zstd for the store tests
        if: runner.os == 'macOS'
        run: brew install zstd
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
