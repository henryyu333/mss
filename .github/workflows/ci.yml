name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: sqlite3 and zstd for the store tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sqlite3 zstd
      - name: sqlite3 and zstd for the store tests
        if: runner.os == 'macOS'
        run: brew install sqlite zstd
      - name: sqlite3 and zstd for the store tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install sqlite zstandard --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:ProgramData\chocolatey\bin\sqlite3.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:ProgramData\chocolatey\bin\zstd.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check gofmt (POSIX)
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
      - name: Check gofmt (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(gofmt -l .)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($files.Count -ne 0) {
            $files | Write-Output
            throw "Run gofmt on the files above"
          }
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Release and benchmark consumer regression tests
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Native synthetic CLI smoke
        run: |
          go build -o mss-smoke.exe ./cmd/mss
          python tools/benchmark.py --binary mss-smoke.exe --sessions 64 --queries 13 --output benchmark-smoke.json
